<text x="944" y="146" fill="#1a7f37" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start">CONTINUE</text>
<text x="916" y="180" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">Pending work runs</text>
<rect x="52" y="203" width="103" height="28" rx="14" fill="#9a6700" fill-opacity="0.12"/>
<text x="103.5" y="222" fill="#9a6700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Claude Code</text>
<rect x="165" y="203" width="99" height="28" rx="14" fill="#0969da" fill-opacity="0.12"/>
<text x="214.5" y="222" fill="#0969da" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Codex</text>
<text x="52" y="262" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Usage % + reset time</text>
<text x="52" y="292" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">No model request</text>
<text x="340" y="220" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Reuse cached readings</text>
<text x="340" y="248" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Refresh when due</text>
<text x="340" y="292" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Preserve freshness metadata</text>
<text x="628" y="219" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" text-anchor="start">Hard cutoff: &gt;98%</text>
<text x="628" y="247" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Weekly lead + hold state</text>
<text x="628" y="292" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Match the calling model</text>
<rect x="916" y="202" width="212" height="65" rx="8" fill="#ffffff" fill-opacity="1" stroke="#d0d7de"/>
<text x="932" y="228" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="start">hook exits successfully</text>
<text x="932" y="250" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">operation continues</text>
<text x="916" y="292" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">No new prompt needed</text>
