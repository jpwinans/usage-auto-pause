<rect x="32" y="110" width="252" height="4" rx="2" fill="#0969da" fill-opacity="1"/>
<circle cx="60" cy="142" r="12" fill="#0969da"/>
<text x="60" y="146" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="80" y="146" fill="#0969da" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start">READ USAGE</text>
<text x="52" y="180" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">Provider quota</text>
