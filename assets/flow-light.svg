<text x="718" y="474" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">Sleep locally, then recheck</text>
<text x="690" y="502" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Claude: 30s poll · Codex: 5s poll</text>
<path d="M1090 483 H1153 V363 H820 V336" fill="none" stroke="#9a6700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="5 6"/>
<text x="958" y="388" fill="#9a6700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">re-evaluate the hold</text>
<text x="590" y="566" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Pauses apply at covered hook boundaries; already-running work is not frozen.</text>
</svg>
