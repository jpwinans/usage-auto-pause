<text x="656" y="146" fill="#9a6700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start">CHECK THE RULES</text>
<text x="628" y="180" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">Applicable hold?</text>
